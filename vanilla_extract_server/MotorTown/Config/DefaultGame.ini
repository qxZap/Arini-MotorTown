e_01", "Driving mode (Comfort/Sport/Drift) changes vehicle handling and response."),NSLOCTEXT("[/Script/AsyncLoadingScreen]", "MT_Tip_Vehicle_02", "Higher-tier tire parts give better grip and durability, keeping cornering stable."),NSLOCTEXT("[/Script/AsyncLoadingScreen]", "MT_Tip_Vehicle_04", "Upgrading engine, transmission, and turbo parts greatly improves acceleration and top speed."),NSLOCTEXT("[/Script/AsyncLoadingScreen]", "MT_Tip_Vehicle_05", "Suspension and stabilizer parts improve cornering stability and ride quality."),NSLOCTEXT("[/Script/AsyncLoadingScreen]", "MT_Tip_Vehicle_07", "Low vehicle condition raises operating costs, so service your vehicles regularly."),NSLOCTEXT("[/Script/AsyncLoadingScreen]", "MT_Tip_Vehicle_08", "Tuning brake balance shifts front/rear braking force and changes stopping distance."),NSLOCTEXT("[/Script/AsyncLoadingScreen]", "MT_Tip_Delivery_01", "Delivery pay scales with distance and cargo weight — heavier loads earn more per kilometer."),NSLOCTEXT("[/Script/AsyncLoadingScreen]", "MT_Tip_Delivery_03", "Food and concrete have time limits — on-time delivery earns a bonus."),NSLOCTEXT("[/Script/AsyncLoadingScreen]", "MT_Tip_Delivery_04", "Unless the destination consumes it, a delivered container becomes empty and must be transported back to the sender."),NSLOCTEXT("[/Script/AsyncLoadingScreen]", "MT_Tip_Passenger_01", "Taxi tip amount depends on arrival speed and driving behavior."),NSLOCTEXT("[/Script/AsyncLoadingScreen]", "MT_Tip_Passenger_02", "Buses earn an on-time bonus when they follow the schedule."),NSLOCTEXT("[/Script/AsyncLoadingScreen]", "MT_Tip_Passenger_06", "Enable auto-accept so taxi or bus AI can pick up passengers for you."),NSLOCTEXT("[/Script/AsyncLoadingScreen]", "MT_Tip_Passenger_07", "Upgrading your depot extends your company taxi's dispatch radius."),NSLOCTEXT("[/Script/AsyncLoadingScreen]", "MT_Tip_Police_04", "Each player can place only 1 spike strip, and it damages only vehicles refusing to stop."),NSLOCTEXT("[/Script/AsyncLoadingScreen]", "MT_Tip_Fire_02", "Firefighting pay grows with distance from roads and stations, and with the size of the fire."),NSLOCTEXT("[/Script/AsyncLoadingScreen]", "MT_Tip_Company_01", "Corporation vehicles keep running even while you're offline."),NSLOCTEXT("[/Script/AsyncLoadingScreen]", "MT_Tip_Housing_03", "Each house allows only one depot."),NSLOCTEXT("[/Script/AsyncLoadingScreen]", "MT_Tip_Item_05", "Drones have limited flight time and range and auto-return when the battery runs out."),NSLOCTEXT("[/Script/AsyncLoadingScreen]", "MT_Tip_Weather_01", "In-game days can last 30–60 real minutes depending on server settings."),NSLOCTEXT("[/Script/AsyncLoadingScreen]", "MT_Tip_Weather_02", "Rain reduces tire grip and visibility — drive with extra care."),NSLOCTEXT("[/Script/AsyncLoadingScreen]", "MT_Tip_Weather_03", "Headlights turn on automatically at night."),NSLOCTEXT("[/Script/AsyncLoadingScreen]", "MT_Tip_Weather_05", "Rain weakens fires and can help put them out."),NSLOCTEXT("[/Script/AsyncLoadingScreen]", "MT_Tip_Multi_02", "Deliveries done in a party automatically split the rewards."),NSLOCTEXT("[/Script/AsyncLoadingScreen]", "MT_Tip_Multi_03", "LAN mode only shows servers on the same local network."),NSLOCTEXT("[/Script/AsyncLoadingScreen]", "MT_Tip_UI_01", "Navigation calculates the route automatically — set a destination and follow the arrow."),NSLOCTEXT("[/Script/AsyncLoadingScreen]", "MT_Tip_UI_02", "In multiplayer, server settings cap how many vehicles each player can have spawned at once; they do not limit vehicle ownership."),NSLOCTEXT("[/Script/AsyncLoadingScreen]", "MT_Tip_UI_03", "Escort missions require the Oversize Escort License to be equipped."),NSLOCTEXT("[/Script/AsyncLoadingScreen]", "MT_Tip_UI_05", "Press F11 to toggle fullscreen mode."),NSLOCTEXT("[/Script/AsyncLoadingScreen]", "MT_Tip_Misc_03", "Tow missions use the winch and trailer hitch to haul broken vehicles to the shop."),NSLOCTEXT("[/Script/AsyncLoadingScreen]", "MT_Tip_Misc_05", "Roads have speed limits, and violations attract police attention."),NSLOCTEXT("[/Script/AsyncLoadingScreen]", "MT_Tip_Misc_06", "Escort pay scales with how much of the route you escorted — stay with the convoy to the end."),NSLOCTEXT("[/Script/AsyncLoadingScreen]", "MT_Tip_Community_01", "You can disable and enable auto-shift using Alt+A while in a vehicle. - Amber"),NSLOCTEXT("[/Script/AsyncLoadingScreen]", "MT_Tip_Community_02", "Don't be shy to ask fellow players for help; we were all new at this game at one point. - Amber"),NSLOCTEXT("[/Script/AsyncLoadingScreen]", "MT_Tip_Community_03", "Company AI earns less than players, but it can keep the town bonus steady and help with supply chains. - Skirakzalus"),NSLOCTEXT("[/Script/AsyncLoadingScreen]", "MT_Tip_Community_04", "Body damage increases drag, lowering top speed and increasing fuel consumption. - TheDanimal"),NSLOCTEXT("[/Script/AsyncLoadingScreen]", "MT_Tip_Community_05", "Park vehicles in a parking spot to despawn them. - fattron"),NSLOCTEXT("[/Script/AsyncLoadingScreen]", "MT_Tip_Community_06", "The Jake Brake is a good way to avoid overheating your main brakes. Press B (default) to use it. - LittleBird"),NSLOCTEXT("[/Script/AsyncLoadingScreen]", "MT_Tip_Community_07", "Carrying too much load may be less efficient than delivering a smaller load multiple times. - Lick"),NSLOCTEXT("[/Script/AsyncLoadingScreen]", "MT_Tip_Community_08", "Bigger is not always better! Larger engines come with increased weight and higher fuel consumption. - Smaen"),NSLOCTEXT("[/Script/AsyncLoadingScreen]", "MT_Tip_Community_10", "Hold Shift on the keyboard to keep your vehicle in its current gear. - LittleBird")),Appearance=(ColorAndOpacity=(SpecifiedColor=(R=1.000000,G=1.000000,B=1.000000,A=1.000000),ColorUseRule=UseColor_Specified),Font=(FontObject="/Script/Engine.Font'/Engine/EngineFonts/Roboto.Roboto'",FontMaterial=None,OutlineSettings=(OutlineSize=1,bMiteredCorners=False,bSeparateFillAlpha=False,b